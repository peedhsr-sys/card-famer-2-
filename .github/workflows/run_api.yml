name: Fetch Complete Farmer Data

on:
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Data Fetcher
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          DPOP_TOKEN: ${{ secrets.DPOP_TOKEN }}
        run: python api_test.py

      - name: Upload Data as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farmer-complete-data
          path: complete_farmer_data.json
          retention-days: 5
