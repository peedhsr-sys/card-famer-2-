name: Run Agristack API Test

on:
  workflow_dispatch: # यह आपको मैन्युअली 'Run workflow' बटन दबाने की अनुमति देता है

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Script
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          DPOP_TOKEN: ${{ secrets.DPOP_TOKEN }}
        run: python api_test.py
